name: Publish to npm and Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'src/**'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      npm_publish_mode:
        description: 'npm publish authentication mode'
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - token

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      should-publish: ${{ steps.check.outputs.should-publish }}
      npm_publish_mode: ${{ steps.publish-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get package version
        id: package-version
        run: echo "version=$(node scripts/package-version-changed.mjs --print-version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch, will publish"
          else
            changed="$(git show "${{ github.event.before }}:package.json" | node scripts/package-version-changed.mjs package.json)"
            if [ "$changed" = "true" ]; then
              echo "should-publish=true" >> "$GITHUB_OUTPUT"
              echo "Version changed, will publish"
            elif [ "$changed" = "false" ]; then
              echo "should-publish=false" >> "$GITHUB_OUTPUT"
              echo "Version unchanged, skipping publish"
            else
              echo "Unexpected version comparison result: $changed" >&2
              exit 1
            fi
          fi

      - name: Select npm publish mode
        id: publish-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.npm_publish_mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run security audit
        run: npm audit --audit-level=low

  publish-npm:
    needs: [check-version, test]
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use npm with trusted publishing support
        if: needs.check-version.outputs.npm_publish_mode == 'trusted'
        run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: npm ci

      - name: Verify npm token authentication
        if: needs.check-version.outputs.npm_publish_mode == 'token'
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Run security audit
        run: npm audit --audit-level=low

      - name: Verify published package
        run: npm run test:package

      - name: Publish to npm with trusted publishing
        if: needs.check-version.outputs.npm_publish_mode == 'trusted'
        run: npm publish --access public

      - name: Publish to npm with token fallback
        if: needs.check-version.outputs.npm_publish_mode == 'token'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
          generate_release_notes: true

  publish-docker:
    needs: [check-version, test, publish-npm]
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (new image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/happy-platform-mcp
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.check-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.check-version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.check-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image (new name)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push final migration tag to old image name
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mcp-servicenow-nodejs:${{ needs.check-version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mcp-servicenow-nodejs:latest
          cache-from: type=gha
