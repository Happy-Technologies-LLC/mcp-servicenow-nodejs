name: Security Patch Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-security-update:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.title, 'security'))
    runs-on: ubuntu-latest
    outputs:
      has-vulnerabilities: ${{ steps.audit.outputs.has-vulnerabilities }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for vulnerabilities
        id: audit
        run: |
          set +e
          npm audit --audit-level=moderate --json > audit.json
          AUDIT_STATUS=$?
          set -e

          case "$AUDIT_STATUS" in
            0|1) ;;
            *)
              echo "::error::npm audit failed with exit code $AUDIT_STATUS"
              exit "$AUDIT_STATUS"
              ;;
          esac

          VULN_COUNT="$(
            node -e "const report = JSON.parse(require('node:fs').readFileSync(0, 'utf8')); const vulnerabilities = report?.metadata?.vulnerabilities; const total = ['moderate', 'high', 'critical'].reduce((sum, severity) => { const count = vulnerabilities?.[severity]; if (!Number.isSafeInteger(count) || count < 0) throw new TypeError('npm audit report is missing vulnerability counts'); return sum + count; }, 0); process.stdout.write(String(total));" < audit.json
          )"

          if { [ "$AUDIT_STATUS" -eq 0 ] && [ "$VULN_COUNT" -ne 0 ]; } ||
             { [ "$AUDIT_STATUS" -eq 1 ] && [ "$VULN_COUNT" -eq 0 ]; }; then
            echo "::error::npm audit exit code and report disagree"
            exit 1
          fi

          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "has-vulnerabilities=true" >> "$GITHUB_OUTPUT"
            echo "Found $VULN_COUNT moderate-or-higher vulnerabilities"
          else
            echo "has-vulnerabilities=false" >> "$GITHUB_OUTPUT"
            echo "No moderate-or-higher vulnerabilities found"
          fi

      - name: Upload audit results
        if: steps.audit.outputs.has-vulnerabilities == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-audit
          path: audit.json

  auto-patch:
    needs: check-security-update
    if: needs.check-security-update.outputs.has-vulnerabilities == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply security patches
        run: npm audit fix --audit-level=moderate

      - name: Bump patch version
        run: 'npm version patch -m "Security patch: %s"'

      - name: Run tests
        run: npm test

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: apply security patches'
          title: 'Security: Automated vulnerability patches'
          body: |
            This PR was automatically generated to fix security vulnerabilities.

            - Applied `npm audit fix` to patch vulnerabilities
            - Bumped patch version
            - All tests passed

            Please review and merge if appropriate.
          branch: security-patch-${{ github.run_number }}
          delete-branch: true
